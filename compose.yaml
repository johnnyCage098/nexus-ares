

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus_ares_db
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nexus_net
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    mem_limit: 2g
    cpus: 1.0

  api:
    build: ./api
    container_name: nexus_ares_api
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus_net
    ports:
      - "5000:5000"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./web
    container_name: nexus_ares_web
    environment:
      API_URL: http://api:5000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexus_net
    ports:
      - "8000:8000"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  nexus_net:
    driver: bridge

volumes:
  sqlserver_data:
